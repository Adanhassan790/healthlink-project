{% load static %}
<nav class="navbar">
    <div class="nav-container">
        <a href="{% url 'home' %}" class="nav-brand">
            <img src="{% static 'images/logo.png' %}" alt="HealthLink Logo" class="nav-logo">
            HealthLink
        </a>
        <ul class="nav-menu">
            <li><a href="{% url 'home' %}" class="nav-link">Home</a></li>
            <li><a href="{% url 'appointments:doctor_list' %}" class="nav-link">Doctors</a></li>
            <li><a href="{% url 'appointments:book_appointment_redirect' %}" class="nav-link">Book Appointment</a></li>
            <li><a href="{% url 'triage:triage' %}" class="nav-link">AI Symptom Checker</a></li>
            
            
            {% if user.is_authenticated %}
                <li><a href="{% url 'messaging:conversation_list' %}" class="nav-link">Messages</a></li>
                <li><a href="{% url 'dashboard' %}" class="nav-link">Dashboard</a></li>
                <li><a href="{% url 'profile' %}" class="nav-link">Profile</a></li>
                <li>
                    <form method="post" action="{% url 'logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-link btn-logout">
                            Logout ({{ user.username }})
                        </button>
                    </form>
                </li>
            {% else %}
                <li><a href="{% url 'login' %}" class="nav-link">Login</a></li>
                <li><a href="{% url 'patient_register' %}" class="nav-link">Patient Register</a></li>
                <li><a href="{% url 'doctor_register' %}" class="nav-link">Doctor Register</a></li>
            {% endif %}
        </ul>
    </div>
</nav>
