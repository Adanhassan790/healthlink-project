{% extends 'base.html' %}

{% block title %}404 - Page Not Found - HealthLink{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h1 style="font-size: 4rem; color: #ffc107;">404</h1>
            <h2>Page Not Found</h2>
            <p class="lead text-muted mt-3">
                {{ error }}
            </p>
            <p class="text-secondary mt-4">
                The page you're looking for doesn't exist or has been moved.
            </p>
            {% if path %}
            <small class="text-muted d-block mt-3">
                Requested path: <code>{{ path }}</code>
            </small>
            {% endif %}
            <div class="mt-5">
                <a href="{% url 'home' %}" class="btn btn-primary me-2">Back to Home</a>
                <a href="javascript:history.back()" class="btn btn-outline-primary">Go Back</a>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        padding: 2rem;
    }
</style>
{% endblock %}
