{% extends 'base.html' %}

{% block title %}500 - Server Error - HealthLink{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h1 style="font-size: 4rem; color: #dc3545;">500</h1>
            <h2>Internal Server Error</h2>
            <p class="lead text-muted mt-3">
                {{ error }}
            </p>
            <p class="text-secondary mt-4">
                We've been notified about this issue and will fix it as soon as possible.
            </p>
            <div class="mt-5">
                <a href="{% url 'home' %}" class="btn btn-primary me-2">Back to Home</a>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-primary">Go to Dashboard</a>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        min-height: 100vh;
    }
    .container {
        padding: 2rem;
    }
</style>
{% endblock %}
