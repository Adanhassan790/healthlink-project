<!-- templates/navbar.html -->
<nav style="background-color: #f8f9fa; padding: 1rem; border-bottom: 1px solid #dee2e6;">
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
        <div>
            <a href="{% url 'home' %}" style="text-decoration: none; font-size: 1.5rem; font-weight: bold; color: #007bff;">
                HealthLink
            </a>
        </div>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'appointments:doctor_list' %}" style="margin-right: 1rem; text-decoration: none; color: #495057;">
                    Find Doctors
                </a>
                <a href="{% url 'appointments:my_appointments' %}" style="margin-right: 1rem; text-decoration: none; color: #495057;">
                    My Appointments
                </a>
                <a href="{% url 'dashboard' %}" style="margin-right: 1rem; text-decoration: none; color: #495057;">
                    Dashboard
                </a>
                <a href="{% url 'logout' %}" style="text-decoration: none; color: #495057;">
                    Logout ({{ user.username }})
                </a>
            {% else %}
                <a href="{% url 'login' %}" style="margin-right: 1rem; text-decoration: none; color: #495057;">
                    Login
                </a>
                <a href="{% url 'users:register' %}" style="text-decoration: none; color: #495057;">
                    Register
                </a>
            {% endif %}
        </div>
    </div>
</nav>
